<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Harmony Helix - Route Roll View</title>
    <style>
        body {
            background-color: #000000;
            color: #e6e6e6;
            font-family: "Comic Sans MS", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 30px;
            margin: 0;
        }
        h3 {
            font-size: 16px;
            font-weight: normal;
            letter-spacing: 0.05em;
            color: #e6e6e6;
            margin-bottom: 20px;
            border-left: 4px solid #6495ED;
            padding-left: 12px;
        }
        .grid-container {
            background-color: #1a1a22;
            border: 1px solid #222228;
            overflow-x: auto;
            margin-bottom: 20px;
            width: 100%;
            max-width: 100%;
        }
        .row-label {
            background-color: #050507;
            color: #9999aa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-family: monospace;
            border-right: 1px solid #222228;
        }       textarea:focus {
            outline: none;
            border-color: #6495ED;
        }
        textarea {
            width: 100%;
            max-width: 600px; /* 💡 ここを広げる（例: 800px や 100% に変更） */
            height: 110px;
            background-color: #0a0a0c;
            border: 1px solid #33333d;
            border-radius: 4px;
            color: #f0f0f0;
            font-family: monospace;
            font-size: 13px;
            padding: 12px;
            box-sizing: border-box;
            margin-bottom: 12px;
            resize: vertical;
            line-height: 1.5;
        }
        button {
            background-color: #16161c;
            border: 1px solid #3b3b4f;
            color: #e6e6e6;
            padding: 8px 18px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 24px;
            transition: all 0.2s;
        }
        button:hover {
            background-color: #22222e;
            border-color: #6495ED;
            color: #ffffff;
        }
    </style>
</head>
<body>

<h3>Harmony Helix — Route Roll View</h3>

<textarea id="scoreInputArea">
#
ch: CEG* BDF* FAC* GBD*
ml: C*. D*/ E* B*
#
ch: CEG* BDF* FAC* GBD*
ml: C*. D*/ E* B*
</textarea>
<br>
<button id="renderButton">描画更新 (Update View)</button>

<div class="grid-container" id="pianoRoll"></div>

<script src="trans.js"></script>
<script src="transCh.js"></script>
<script src="merge.js"></script>
<script src="view.js"></script>

</body>
</html>
